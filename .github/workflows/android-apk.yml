
name: Prime AI Gemini APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Prime AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find or Extract Android Project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            mkdir -p extracted

            for ZIP in $(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*'); do
              echo "Extracting: $ZIP"
              DEST="extracted/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"
              unzip -oq "$ZIP" -d "$DEST"
            done

            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            find . -maxdepth 5 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: gradle -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f -path '*/build/outputs/apk/debug/app-debug.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-AI-Gemini-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
