
name: Prime AI FastReply APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Prime AI FastReply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract FastReply Source ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "*FastReply*.zip" \
            ! -path "./extracted/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FastReply ZIP not found. Searching for another source ZIP..."

            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "*.zip" \
              ! -iname "*apk*" \
              ! -path "./extracted/*" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found!"
            exit 1
          fi

          echo "Using source: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android Project
        run: |
          SETTINGS_FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project structure verified!"

      - name: Build Prime AI APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-AI-FastReply-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
